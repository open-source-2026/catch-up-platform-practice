spring.application.name=Catchup Platform

# Spring Datasource Configuration

spring.datasource.url=jdbc:mysql://localhost:3306/catchup_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true

# Spring JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical=com.acme.catchup.platform2.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy


